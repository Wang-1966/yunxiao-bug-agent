# Based on Langfuse v4.81.0's official Docker Compose deployment.
# https://github.com/langfuse/langfuse/blob/v4.81.0/docker-compose.yml
name: yunxiao-langfuse
services:
  worker:
    image: docker.langfuse.com/langfuse/langfuse-worker:4.81.0
    restart: unless-stopped
    depends_on: &dependencies
      postgres: {condition: service_healthy}
      clickhouse: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    environment: &environment
      NEXTAUTH_URL: http://localhost:3002
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Run setup.py}@postgres:5432/langfuse
      SALT: ${SALT:?Run setup.py}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Run setup.py}
      TELEMETRY_ENABLED: 'false'
      CLICKHOUSE_MIGRATION_URL: clickhouse://clickhouse:9000
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run setup.py}
      CLICKHOUSE_CLUSTER_ENABLED: 'false'
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_AUTH: ${REDIS_PASSWORD:?Run setup.py}
      LANGFUSE_S3_EVENT_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_REGION: auto
      LANGFUSE_S3_EVENT_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_EVENT_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Run setup.py}
      LANGFUSE_S3_EVENT_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_EVENT_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_EVENT_UPLOAD_PREFIX: events/
      LANGFUSE_S3_MEDIA_UPLOAD_BUCKET: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_REGION: auto
      LANGFUSE_S3_MEDIA_UPLOAD_ACCESS_KEY_ID: langfuse
      LANGFUSE_S3_MEDIA_UPLOAD_SECRET_ACCESS_KEY: ${MINIO_PASSWORD:?Run setup.py}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://minio:9000
      LANGFUSE_S3_MEDIA_UPLOAD_FORCE_PATH_STYLE: 'true'
      LANGFUSE_S3_MEDIA_UPLOAD_PREFIX: media/
  web:
    image: docker.langfuse.com/langfuse/langfuse:4.81.0
    restart: unless-stopped
    depends_on: *dependencies
    ports: ['127.0.0.1:3002:3000']
    environment:
      <<: *environment
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?Run setup.py}
      LANGFUSE_S3_MEDIA_UPLOAD_ENDPOINT: http://localhost:19090
      LANGFUSE_S3_MEDIA_UPLOAD_INTERNAL_ENDPOINT: http://minio:9000
      LANGFUSE_INIT_ORG_ID: yunxiao-local
      LANGFUSE_INIT_ORG_NAME: Yunxiao
      LANGFUSE_INIT_PROJECT_ID: yunxiao-agent
      LANGFUSE_INIT_PROJECT_NAME: Bug Repair Agent
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:?Run setup.py}
      LANGFUSE_INIT_PROJECT_SECRET_KEY: ${LANGFUSE_SECRET_KEY:?Run setup.py}
      LANGFUSE_INIT_USER_EMAIL: ${LANGFUSE_ADMIN_EMAIL:?Run setup.py}
      LANGFUSE_INIT_USER_NAME: Local Admin
      LANGFUSE_INIT_USER_PASSWORD: ${LANGFUSE_ADMIN_PASSWORD:?Run setup.py}
  postgres:
    image: postgres:17.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run setup.py}
      POSTGRES_DB: langfuse
    volumes: ['postgres:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d langfuse']
      interval: 5s
      timeout: 5s
      retries: 20
  clickhouse:
    image: clickhouse/clickhouse-server:26.3.62.3
    restart: unless-stopped
    user: '101:101'
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: langfuse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Run setup.py}
    volumes: ['clickhouse:/var/lib/clickhouse', 'clickhouse-logs:/var/log/clickhouse-server']
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--spider', 'http://localhost:8123/ping']
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: cgr.dev/chainguard/minio@sha256:1ec745a06a986762f89e68e855fc189f403941eff8c0a5f94767e92c8e39d3f5
    restart: unless-stopped
    entrypoint: sh
    command: -c 'mkdir -p /data/langfuse && minio server --address ":9000" /data'
    environment:
      MINIO_ROOT_USER: langfuse
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:?Run setup.py}
    ports: ['127.0.0.1:19090:9000']
    volumes: ['minio:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7.4.5
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD:?Run setup.py}', '--maxmemory-policy', 'noeviction']
    volumes: ['redis:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli ping | grep PONG']
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Run setup.py}
volumes:
  postgres:
  clickhouse:
  clickhouse-logs:
  minio:
  redis:
